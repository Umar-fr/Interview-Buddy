[package]
name = "interview-buddy"
version = "0.1.8"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "interview_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.0"

[dependencies]
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["tls"] }
tauri-plugin-global-shortcut = "2"
base64 = "0.23.1"
screenshots = "0.8.10"
rubato = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
whisper-rs = { version = "0.14", features = ["metal"] }
cocoa = "0.26"
objc = "0.2"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
whisper-rs = { version = "0.14", features = ["vulkan"] }
cpal = "0.15"
windows = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(all(not(target_os = "macos"), not(windows)))'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
whisper-rs = { version = "0.14" }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
